name: Update Google Scholar metrics

on:
  schedule:
    # Sundays 08:00 UTC
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar metrics
        run: python scripts/update_scholar.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "No changes to data/scholar.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "chore: update Google Scholar metrics"
          git push
